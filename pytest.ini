[pytest]
testpaths = api/tests tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
; Real bug, found live (Story 0.4): api/tests/test_health.py and
; tests/test_health.py share a basename with no __init__.py in either
; directory, so pytest's default "prepend" import mode raises a real
; "import file mismatch" the moment both directories are collected
; together -- which is exactly why nobody had run api/tests/ and tests/
; in the same invocation before (CI's own `cd api && pytest` only ever
; saw api/tests/, silently never running tests/test_story_0_*_acceptance.py
; at all). importlib mode resolves each file by its own real path, not a
; single global sys.modules name, so same-basename files across
; directories are never ambiguous -- the standard fix, not renaming files.
addopts = --import-mode=importlib
