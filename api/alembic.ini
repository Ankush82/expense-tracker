# Alembic configuration for the expense tracker API.
#
# The DB URL is supplied programmatically by alembic/env.py from the same
# Settings object the FastAPI app uses, so we intentionally leave
# sqlalchemy.url empty here. Hard-coding it would either duplicate
# .env / risk diverging, or pin a DSN that is wrong for every other
# environment (CI, local Docker, production).
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# File template for new revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for revision timestamps.
timezone = UTC

# Truncate long migration names.
truncate_slug_length = 40

# Set in the env.py via `version_path_separator`.
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S